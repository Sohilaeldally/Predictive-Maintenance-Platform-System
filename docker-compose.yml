services:
  postgres:
    image: postgres:16-alpine
    container_name: predmaint_postgres

    environment:
      POSTGRES_DB: predictive_maintenance_db
      POSTGRES_USER: predmaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  api:
    build: .
    container_name: predmaint_api

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: predictive_maintenance_db
      POSTGRES_USER: predmaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "8000:8000"

    depends_on:
      - postgres

  dashboard:
    build: ./dashboard
    container_name: predmaint_dashboard

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    depends_on:
      - api

volumes:
  postgres_data: